name: BACY-10 LiveKit Complete Source

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bacy10-livekit-complete-source-20261118
      - fix/bacy10-connected-mobile-cloud-20261118
      - main
      - feature/bacy10-android-phone-personal-memory-20261118
      - feature/bacy10-built-in-owner-profile-20261118
    paths:
      - .github/workflows/bacy10-livekit-complete-source.yml
      - tools/bacy10_build_livekit_package.py
      - tools/bacy10_phone_memory_upgrade.py
      - tools/bacy10_android_device_controls.py
      - tools/bacy10_center_orb.py
      - tools/bacy10_owner_profile_upgrade.py
      - tools/bacy10_assistant_reliability_upgrade.py
      - tools/bacy10_v15_assistant_upgrade.py
      - tools/bacy10_v16_visual_results_upgrade.py
      - tools/bacy10_v17_fluid_motion_upgrade.py
      - tools/bacy10_v18_search_skills_upgrade.py
      - config/bacy10-owner-profile.json
      - BACY10-LIVEKIT-DOWNLOAD.md

# Only test the newest source revision; cancel obsolete APK builds on this branch.
concurrency:
  group: bacy10-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-bundle:
    name: Package full real LiveKit source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BACY-10 repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned full tutorial and apply BACY-10 setup
        run: python tools/bacy10_build_livekit_package.py --output build/BACY10-LIVEKIT-FULL-SOURCE

      - name: Validate essential source and exclude secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("build/BACY10-LIVEKIT-FULL-SOURCE")
          assert (root/"agent/src/agent.py").is_file()
          assert (root/"agent/src/browser.py").is_file()
          assert (root/"agent/src/tools.py").is_file()
          assert (root/"agent/frontend/package.json").is_file()
          assert (root/"agent/uv.lock").is_file()
          assert (root/"mobile/lib/main.dart").is_file()
          assert (root/"mobile/android/app/build.gradle").is_file()
          manifest=(root/"mobile/android/app/src/main/AndroidManifest.xml").read_text()
          assert 'android.permission.INTERNET' in manifest, "Release APK must have INTERNET permission"
          assert (root/"mobile/assets/.env").is_file()
          assert not list(root.rglob(".env.local")), "Private environment file must never be bundled"
          assert not [p for p in root.rglob("*") if p.suffix.lower() in {".otf", ".ttf", ".woff", ".woff2", ".eot"}], "Font binaries are excluded from the distribution"
          agent=(root/"agent/src/agent.py").read_text()
          assert 'agent_name="bacy-10"' in agent
          assert "gemini-3.1-flash-live-preview" in agent
          assert "BrowserTools" in agent
          mobile=(root/"mobile/lib/controllers/app_ctrl.dart").read_text()
          assert "connectionError" in mobile
          assert "EndpointTokenSource" in mobile
          assert "PairingTokenClient" in mobile
          assert "bacy10.phone" in mobile
          assert "bacy10.memory" in mobile
          assert (root/"mobile/lib/support/bacy10_memory.dart").is_file()
          assert (root/"agent/src/phone_tools.py").is_file()
          assert "set_phone_torch" in (root/"agent/src/phone_tools.py").read_text()
          assert (root/"mobile/lib/widgets/bacy_live_orb.dart").is_file()
          assert "BacyLiveOrb" in (root/"mobile/lib/screens/agent_screen.dart").read_text()
          assert "My private memory" not in (root/"mobile/lib/screens/welcome_screen.dart").read_text()
          assert "Mathematics" in (root/"config/bacy10-owner-profile.json").read_text()
          assert (root/"mobile/android/app/src/main/kotlin/com/livekit/example/VoiceAssistant/BacyAccessibilityService.kt").is_file()
          assert "navigate_on_android" in (root/"agent/src/phone_tools.py").read_text()
          assert "generate_image_with_ai" in (root/"agent/src/phone_tools.py").read_text()
          assert "BacyResultsPanel" in (root/"mobile/lib/screens/agent_screen.dart").read_text()
          assert "sdk.AgentState.speaking" in (root/"mobile/lib/widgets/bacy_live_orb.dart").read_text()
          assert (root/"agent/src/quick_search.py").is_file()
          assert (root/"mobile/android/app/src/main/kotlin/com/livekit/example/VoiceAssistant/BacyWakeListener.kt").is_file()
          assert "setScreenShareEnabled(true)" in mobile
          assert "PhoneTools" in agent
          assert "LIVEKIT_SANDBOX_ID" not in mobile
          assert "LIVEKIT_TOKEN_ENDPOINT=" in (root/"mobile/assets/.env").read_text()
          print("SOURCE VALIDATION PASSED: real agent, browser tools, web app, Flutter mobile and safe templates")
          PY
          find build/BACY10-LIVEKIT-FULL-SOURCE -type d -name __pycache__ -prune -exec rm -rf '{}' +

      - name: Upload complete source as download ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BACY10-LIVEKIT-FULL-SOURCE
          path: build/BACY10-LIVEKIT-FULL-SOURCE/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  python-agent:
    name: Check real Python agent dependencies and tests
    needs: source-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BACY10-LIVEKIT-FULL-SOURCE
          path: ./source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Resolve Python/LiveKit agent dependencies
        working-directory: source/agent
        run: uv sync --python 3.12 --locked
      - name: Compile Python agent
        working-directory: source/agent
        run: uv run python -m compileall -q src
      - name: Install real Playwright Chromium for browser tests
        working-directory: source/agent
        run: uv run playwright install --with-deps chromium
      - name: Run offline agent and real browser tests
        working-directory: source/agent
        run: uv run pytest -q tests/test_prompts.py tests/test_web_search.py tests/test_quick_search.py tests/test_browser.py
      # The upstream tests/test_agent.py evaluates live LLM responses using a
      # real LiveKit inference API key. Run it ONLY in your configured environment;
      # no fabricated keys are supplied to CI.

  flutter-android:
    name: Check Flutter Android source and compile debug APK
    needs: source-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BACY10-LIVEKIT-FULL-SOURCE
          path: ./source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.2"
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: source/mobile
        run: flutter pub get
      - name: Analyze Flutter Dart
        working-directory: source/mobile
        run: flutter analyze --no-fatal-infos
      - name: Compile real Android debug APK
        working-directory: source/mobile
        run: flutter build apk --debug
      - name: Upload optional compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BACY10-LIVEKIT-ANDROID-DEBUG
          path: source/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Compile Android release-style APK (private testing signature)
        working-directory: source/mobile
        run: flutter build apk --release
      - name: Upload BACY-10 Android release-style APK
        uses: actions/upload-artifact@v4
        with:
          name: BACY10-LIVEKIT-ANDROID-RELEASE
          path: source/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

  nextjs-web:
    name: Build complete Next.js LiveKit web frontend
    needs: source-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BACY10-LIVEKIT-FULL-SOURCE
          path: ./source
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install real frontend dependencies
        working-directory: source/agent/frontend
        run: pnpm install --frozen-lockfile
      - name: Build LiveKit Next.js web frontend
        working-directory: source/agent/frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  livekit-cloud-update:
    name: Deploy updated voice-agent tools after all checks pass
    if: github.ref == 'refs/heads/feature/bacy10-built-in-owner-profile-20261118'
    needs: [python-agent, flutter-android, nextjs-web]
    runs-on: ubuntu-latest
    environment: livekit-production
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BACY10-LIVEKIT-FULL-SOURCE
          path: ./source
      - name: Check private cloud credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          test -n "$LIVEKIT_URL"
          test -n "$LIVEKIT_API_KEY"
          test -n "$LIVEKIT_API_SECRET"
          test -n "$GOOGLE_API_KEY"
      - name: Install official LiveKit CLI
        run: curl -fsSL https://get.livekit.io/cli | bash
      - name: Deploy tested BACY-10 agent to existing LiveKit service
        working-directory: source/agent
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf 'GOOGLE_API_KEY=%s\n' "$GOOGLE_API_KEY" > "$RUNNER_TEMP/bacy10-agent-secrets.env"
          lk project add --url "$LIVEKIT_URL" --api-key "$LIVEKIT_API_KEY" --api-secret "$LIVEKIT_API_SECRET" --default bacy10
          lk agent deploy --id "CA_4rt8fujSg5pZ" --secrets-file "$RUNNER_TEMP/bacy10-agent-secrets.env"
          rm -f "$RUNNER_TEMP/bacy10-agent-secrets.env"
