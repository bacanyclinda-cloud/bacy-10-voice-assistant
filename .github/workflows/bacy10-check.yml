name: BACY-10 build and tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun install --frozen-lockfile
      - name: Parse all workflow YAML files
        run: bunx prettier --parser yaml .github/workflows/*.yml > /dev/null
      - run: bun run build
      - run: bun run test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every repository Python tool
        run: python -m compileall -q tools
      - name: Test deployed cloud-memory Worker security
        run: node --test cloud/bacy10-memory-worker.test.mjs
